[package]
name = "upriv-fuse"
version.workspace = true
description = "Linux FUSE helper loaded by the daemon only when a vault folder is mounted"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "upriv_fuse"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
upriv-fuse-abi = { path = "../upriv-fuse-abi" }

[target.'cfg(target_os = "linux")'.dependencies]
# `abi-7-10` asks the kernel for big writes: a copy into the folder arrives in
# pieces of up to 128 KiB, not one 4 KiB page per request, each of which would
# seal its chunk again.
fuser = { version = "=0.15.1", features = ["abi-7-10"] }
libc = "=0.2.186"
