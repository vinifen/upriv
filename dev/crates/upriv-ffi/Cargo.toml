[package]
name = "upriv-ffi"
version.workspace = true
description = "UniFFI bridge — mobile RN loads libupriv_ffi.so / staticlib into the app process"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "upriv_ffi"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
serde_json = "=1.0.150"
uniffi = "=0.28.3"
upriv-core = { path = "../upriv-core" }
upriv-rpc = { path = "../upriv-rpc" }

[features]
default = []
cli = ["uniffi/cli"]
