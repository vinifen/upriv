[package]
name = "upriv-core"
version.workspace = true
description = "Upriv shared Rust core (desktop, mobile)"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "upriv_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
aes-siv = "=0.7.0"
argon2 = "=0.5.3"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
toml = "=0.8.23"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
# Portable .7z Plan B encoder (logical files in RAM). Not vault rest crypto.
# Pinned below 0.21: 0.21+ wants aes 0.9 / sha2 0.11, which vendor [patch] cannot satisfy.
# 0.20.1+ encrypts small headers (7-Zip -mhe).
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["aes256", "compress"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.15.1"

[dev-dependencies]
tempfile = "3"
