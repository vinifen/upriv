[package]
name = "upriv-core"
version.workspace = true
description = "Upriv shared Rust core (desktop, mobile)"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "upriv_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
aes-siv = "=0.7.0"
argon2 = "=0.5.3"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
toml = "=0.8.23"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
