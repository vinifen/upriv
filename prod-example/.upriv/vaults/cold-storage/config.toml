# Vault config — storage, security, backup, 7z, policies
# Example — encrypted_dir (closed)

[vault]
id = "cold-storage"
display_name = "Cold Storage"
order = 2
password_hint = "Winter project codes"
note = "Long-term archive — open rarely"

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
# Session — password retention (PRD §4); default session_ram (all storage modes)
mode = "session_ram"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"
password_changed_at = "2026-05-28T10:00:00Z"

[auto_close]
enabled = false
idle_minutes = 15
warn_before_seconds = 0
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

[policy]
allow_external_editors = true
disallow_copy_outside_mount = false
require_unmount_on_sleep = false
