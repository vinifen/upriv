# Vault config — storage, security, backup, 7z
# Example — encrypted_dir (closed)

[vault]
id = "cold-storage"
display_name = "Cold Storage"
order = 2
password_hint = "Winter project codes"
note = "Long-term archive — open rarely"

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
wipe_passes = 1
wipe_pattern = "random"
password_changed_at = "2026-05-28T10:00:00Z"

[auto_close]
enabled = false
idle_minutes = 15

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

