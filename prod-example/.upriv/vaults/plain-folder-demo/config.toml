# Vault config — storage, security, backup, 7z, policies
# Example — upriv_plain: plaintext workspace while open; rest = contents/

[vault]
id = "plain-folder-demo"
display_name = "Plain Folder Demo"
order = 3

[storage]
mode = "upriv_plain"

# Unlock RAM (Argon2id) lives in contents/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
# Session — password retention (PRD §4); disk modes allowed in all storage modes
mode = "disk_open_close"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 30
warn_before_seconds = 120
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

[policy]
allow_external_editors = true
disallow_copy_outside_mount = false
require_unmount_on_sleep = false
