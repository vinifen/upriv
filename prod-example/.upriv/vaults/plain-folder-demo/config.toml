# Vault config — storage, security, backup, 7z
# Example — upriv_plain: plaintext workspace while open; rest = store/

[vault]
id = "plain-folder-demo"
display_name = "Plain Folder Demo"
order = 3

[storage]
mode = "upriv_plain"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 30

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

