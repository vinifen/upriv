# Vault config — storage, security, backup, 7z
# Example 1 — baseline closed vault (encrypt-only archive, keep_last backup)

[vault]
id = "my-encrypted-notes"
display_name = "My Encrypted Notes"
order = 4
password_hint = "hint: childhood street"
note = "Personal notes and drafts."

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = true
mode = "keep_last"
keep_last = 1

[security]
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"
compression_level = 5
solid = false
method = "lzma2"

