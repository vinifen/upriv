# Vault config — storage, security, backup, 7z, policies
# Example 2 — compress + encrypt, keep_all backups, auto-close with warning

[vault]
id = "vault-example-2"                              # normalized (folder, backups, paths)
display_name = "Vault ExaMple 2"                    # UI — verbatim user input at creation
order = 1

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in contents/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = true
mode = "keep_all"

[security]
# Session — password retention (PRD §4); v1 encrypted_dir → session_ram
mode = "session_ram"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = true
idle_minutes = 15
warn_before_seconds = 60
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "compress_encrypt"
compression_level = 5
solid = false
method = "lzma2"

[policy]
allow_external_editors = true
disallow_copy_outside_mount = true
require_unmount_on_sleep = true
