# Vault config — storage, security, backup, 7z, policies (static; survives seal)
# Demo — ram_only: .7z + RAM session; no store; lock always seals

[vault]
id = "ram-only-demo"
display_name = "RAM Only Demo"
order = 14
vault_file = "archive/RAM Only Demo.7z"
note = "Volatile RAM session; lock always seals."

[storage]
mode = "ram_only"

[close]
default_action = "seal"

[backup]
enabled = false
mode = "keep_last"

[security]
mode = "session_ram"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15
warn_before_seconds = 60
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"
compression_level = 0
solid = false
method = "lzma2"

[policy]
allow_external_editors = false
disallow_copy_outside_mount = true
require_unmount_on_sleep = true
