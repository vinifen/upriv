# Vault config — demo example for list reorder testing
# Group membership is not here. If this vault is in a group, see .upriv/vault_groups.toml.

[vault]
id = "backup-mirror"
display_name = "Backup Mirror"
order = 14
password_hint = ""
note = "Secondary copy vault"

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

