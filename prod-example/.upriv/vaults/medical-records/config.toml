# Vault config — demo example for list reorder testing

[vault]
id = "medical-records"
display_name = "Medical Records"
order = 9
password_hint = ""
note = "Private health documents"

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in store/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

