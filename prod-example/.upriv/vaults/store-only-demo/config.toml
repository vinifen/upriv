# Vault config — storage, security, backup, 7z, policies (static; survives seal)
# Demo — store_only: encrypted store is primary; .7z on seal/export (closed cache)

[vault]
id = "store-only-demo"
display_name = "Store Only Demo"
order = 13
vault_file = "archive/Store Only Demo.7z"
store_dir = "store"
backups_dir = "backups"
note = "Encrypted store primary; .7z on seal."

[storage]
mode = "store_only"

[close]
default_action = "close"

[backup]
enabled = true
mode = "keep_last"
keep_last = 1

[security]
mode = "session_ram"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15
warn_before_seconds = 60
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"
compression_level = 0
solid = false
method = "lzma2"

[policy]
allow_external_editors = false
disallow_copy_outside_mount = true
require_unmount_on_sleep = true
