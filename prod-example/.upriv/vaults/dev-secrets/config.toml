# Vault config — demo example for list reorder testing

[vault]
id = "dev-secrets"
display_name = "Dev Secrets"
order = 12
password_hint = "Not production"
note = "API keys and env templates"

[storage]
mode = "encrypted_dir"

# Unlock RAM (Argon2id) lives in contents/vault.header — not in config.toml.
# There is no [kdf] section here; upriv-core reads KDF params from the header.

[backup]
enabled = false
mode = "keep_last"

[security]
# Session — password retention (PRD §4); v1 encrypted_dir → session_ram
mode = "session_ram"
secure_wipe_workspace = true
wipe_passes = 1
wipe_pattern = "random"

[auto_close]
enabled = false
idle_minutes = 15
warn_before_seconds = 0
close_on_app_exit = false

[seven_zip]
encrypt_file_names = true
archive_mode = "encrypt_only"

[policy]
allow_external_editors = true
disallow_copy_outside_mount = false
require_unmount_on_sleep = false
